# rtfm source manifest. Copy to ~/.rtfm/manifest.toml and edit.
# Each [[source]] is one place rtfm indexes, in place. Two modes:
#
#   1. The "default" drop-dir — quick-and-dirty scratch. Drop files in, search finds them
#      (it self-heals on search). Created for you automatically; keep it small.
#   2. Pointed-to folders — an organized corpus you manage. These are indexed only when you
#      run the `reindex` tool, so a large set never blocks a search. Read-only by default.

[[source]]
name    = "default"            # the zero-config drop-dir; the only mutable source by default
type    = "dir"
path    = "~/.rtfm/default"
mutable = true

# Example: point at a large, organized doc set. Run reindex("vendor-docs") once after adding it;
# searches are instant thereafter. Byte-identical files across version subfolders are stored once.
# [[source]]
# name    = "vendor-docs"
# type    = "dir"
# path    = "/path/to/vendor/Documentation"
# mutable = false
