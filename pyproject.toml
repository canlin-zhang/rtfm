# Dev/test environment only. The runtime/launcher source of truth for dependencies
# remains the PEP-723 `# /// script` block in rtfm_server.py (ADR 0009); these are
# mirrored here so `uv run pytest` works and `import rtfm_server` resolves from the root.
[project]
name = "rtfm"
version = "0.4.0"
description = "Read The Full Manual — local document-corpus search MCP server."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "pymupdf",
    "pypdf",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle, pyflakes, isort, pyupgrade, bugbear
