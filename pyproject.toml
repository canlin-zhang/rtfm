# Package manifest for the published core (`rtfm-mcp` on PyPI). This is the
# single dependency declaration; there is no PEP-723 mirror (ADR 0017). The dev
# group and tool config below exist only for working on the repo.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtfm-mcp"
version = "0.9.2"
description = "Read The Full Manual — local document-corpus search MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Canlin Zhang" }]
keywords = ["mcp", "documentation", "search", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "mcp[cli]>=1.28.1,<2",
    "pymupdf",
    "pypdf",
]

[project.urls]
Homepage = "https://github.com/canlin-zhang/rtfm"
Repository = "https://github.com/canlin-zhang/rtfm"
Issues = "https://github.com/canlin-zhang/rtfm/issues"

[project.scripts]
rtfm-server = "rtfm_server:main"

[tool.hatch.build.targets.wheel]
# The core is the `rtfm` package; `rtfm_server.py` stays as the console facade (ADR 0017).
only-include = ["rtfm", "rtfm_server.py"]

[tool.hatch.build.targets.sdist]
include = [
    "rtfm",
    "rtfm_server.py",
    "manifest.example.toml",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle, pyflakes, isort, pyupgrade, bugbear
