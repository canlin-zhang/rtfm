name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11 (open upper bound); prove it on each version.
        # 3.14 is load-bearing: pathlib's exists()/is_file() stopped raising on
        # unreadable paths there, which is why bump's guard is stat()-based —
        # a reversion of the unreadable-path branch would be CI-invisible
        # without it (the S_ISREG type-check half is pinned on every version).
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests (Python ${{ matrix.python-version }})
        run: uv run --python ${{ matrix.python-version }} pytest -q

  # The contract suite is ASCII-hermetic (explicit UTF-8 reads/writes, the
  # require_ascii pins) — prove it under a POSIX locale, where the launch and
  # check reads' explicit encoding is load-bearing. The require_ascii tests
  # skip here (on an ASCII host the env-propagation assert would be vacuous)
  # and run on the UTF-8 legs (where their children still get LC_ALL=C via
  # env_extra, so the assert is meaningful there).
  test-ascii:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C
      PYTHONUTF8: "0"
      PYTHONCOERCECLOCALE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Contract suite under the ASCII locale
        run: uv run pytest tests/test_version_consistency.py -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uvx ruff check .

  consistency:
    # The release version lives in pyproject.toml, uv.lock, and plugin.json; the
    # dependency list is mirrored in pyproject.toml and the PEP-723 block. Nothing
    # mechanical linked them, and drift broke the 0.5.1 launch fix (versions
    # lagged; the lock resolved mcp below its pin). This job guards both: the
    # script compares declared strings, uv lock --check compares resolved ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Version and pin consistency
        run: python3 scripts/check_version_consistency.py
      - name: Lockfile freshness
        run: uv lock --check
